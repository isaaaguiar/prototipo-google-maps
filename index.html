<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protótipo – Redesign Google Maps</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e8eaed;--card:#fff;--tx:#202124;--mut:#5f6368;--line:#dadce0;--blue:#1a73e8;--ok:#0d652d;--okbg:#e6f4ea;--bad:#a50e0e;--warn:#7a4100;--warnbg:#fef3e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111316;--card:#202124;--tx:#e8eaed;--mut:#9aa0a6;--line:#3c4043;--blue:#8ab4f8;--ok:#81c995;--okbg:#173625;--bad:#f28b82;--warn:#fdd663;--warnbg:#3a2f10}}
:root[data-theme="dark"]{--bg:#111316;--card:#202124;--tx:#e8eaed;--mut:#9aa0a6;--line:#3c4043;--blue:#8ab4f8;--ok:#81c995;--okbg:#173625;--bad:#f28b82;--warn:#fdd663;--warnbg:#3a2f10}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
.note{max-width:390px;font-size:13px;color:var(--mut);margin:0 0 10px}
.phone{width:100%;max-width:390px;height:720px;background:var(--card);border-radius:28px;border:1px solid var(--line);overflow:hidden;position:relative;display:flex;flex-direction:column}
.map{height:110px;background:linear-gradient(135deg,#cfe8d5 0 30%,#e3e9d6 30% 55%,#d5e3f2 55%);position:relative;flex:none}
.map i{position:absolute;width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#d93025}
.bar{padding:10px 14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);flex:none}
.bar input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:20px;padding:8px 14px;font:inherit}
.chips{padding:8px 14px;display:flex;gap:8px;flex:none;overflow-x:auto}
button{font:inherit;cursor:pointer;color:var(--tx)}button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:6px 12px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.list{overflow:auto;flex:1}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px}
.item b{font-size:16px}.mut{color:var(--mut);font-size:13px}
.st{font-weight:700}.st.open{color:var(--ok)}.st.closed{color:var(--bad)}
.tag{display:inline-block;margin-top:4px;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--okbg);color:var(--ok)}
.tag.w{background:var(--warnbg);color:var(--warn)}
.photos{display:flex;gap:4px;padding:0 14px}.photos div{flex:1;height:96px;border-radius:8px}
.det{overflow:auto;flex:1;padding-bottom:16px}.det section{padding:8px 14px}
.back{border:0;background:none;padding:12px 14px;color:var(--blue);font-weight:600;text-align:left}
.selo{display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:10px;margin-top:8px;background:var(--okbg);color:var(--ok)}
.selo.w{background:var(--warnbg);color:var(--warn)}.selo b{display:block}
.big{font-size:20px;font-weight:700;margin:2px 0}
.act{display:flex;gap:8px;padding:8px 14px}.act button{flex:1;min-height:48px;border-radius:24px;border:1px solid var(--blue);background:var(--card);color:var(--blue);font-weight:600}
.act .go{background:var(--blue);color:#fff}:root[data-theme="dark"] .act .go,.act .go{color:#fff}
.act button:disabled{border-color:var(--line);color:var(--mut);cursor:default}
.toast{position:absolute;left:14px;right:14px;bottom:16px;background:#202124;color:#fff;padding:12px 14px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none}.toast.on{opacity:1}
.hide{display:none!important}.empty{padding:24px 14px;color:var(--mut)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style></head><body>
<p class="note">Protótipo clicável do redesign. Toque em um local, use "Confirmar horário" e o filtro "Só informações confirmadas" (M1 a M5).</p>
<div class="phone">
 <div id="s-busca" style="display:flex;flex-direction:column;height:100%">
  <div class="map"><i style="left:60px;top:40px"></i><i style="left:170px;top:62px"></i><i style="left:280px;top:34px"></i></div>
  <div class="bar"><input aria-label="Buscar" value="restaurantes por perto" readonly></div>
  <div class="chips"><button class="chip" id="filtro" aria-pressed="false">Só informações confirmadas</button><button class="chip">Aberto agora</button><button class="chip">Nota 4,0+</button></div>
  <div class="list" id="lista"></div>
 </div>
 <div id="s-ficha" style="display:none;flex-direction:column;height:100%">
  <button class="back" id="voltar">‹ Voltar aos resultados</button>
  <div class="det" id="ficha"></div>
 </div>
 <div class="toast" id="toast" role="status"></div>
</div>

 $('lista').innerHTML=a.length?a.map(([p,i])=>`<button class="item" data-i="${i}"><b>${p.n}</b><div class="mut">${p.r} · ${p.c}</div><div><span class="st ${p.open?'open':'closed'}">${p.open?'Aberto':'Fechado'}</span> <span class="mut">· ${p.h}</span></div><span class="tag ${p.ok?'':'w'}">${p.ok?'✓ Confirmado recentemente':'⚠ Não confirmado recentemente'}</span></button>`).join(''):'<div class="empty">Nenhum local com informação confirmada. Desative o filtro para ver todos.</div>'}
function ficha(){const p=L[atual];
 $('ficha').innerHTML=`<div class="photos">${p.col.map(c=>`<div style="background:${c}"></div>`).join('')}</div>
 <section><div class="mut">${p.f}</div><div class="big">${p.n}</div><div class="mut">${p.r} · ${p.c}</div>
 <div class="big"><span class="st ${p.open?'open':'closed'}">${p.open?'Aberto':'Fechado'}</span> · ${p.h}</div>
 <div class="selo ${p.ok?'':'w'}"><span aria-hidden="true">${p.ok?'✓':'⚠'}</span><div><b>${p.t}</b>${p.ok?'':'Informação pode estar desatualizada — confirme antes de ir.'}</div></div></section>
 <div class="act"><button id="conf" ${p.ok&&p.done?'disabled':''}>${p.done?'Horário confirmado':'Confirmar horário'}</button><button class="go" id="rota">Rotas</button></div>`;
 $('conf').onclick=()=>{p.ok=true;p.done=true;p.t='Horário confirmado agora · por você e mais 6 visitantes';p.f='Fotos de 2 anos atrás';ficha();toast('Horário confirmado. Obrigado por ajudar!')};
 $('rota').onclick=()=>toast(p.ok?'Abrindo rotas até '+p.n:'Atenção: horário não confirmado. Confirme antes de ir.')}
function tela(x){$('s-busca').style.display=x?'none':'flex';$('s-ficha').style.display=x?'flex':'none'}
$('lista').onclick=e=>{const b=e.target.closest('.item');if(b){atual=+b.dataset.i;ficha();tela(1)}};
$('voltar').onclick=()=>{lista();tela(0)};
$('filtro').onclick=e=>{filtro=!filtro;e.currentTarget.setAttribute('aria-pressed',filtro);lista()};
lista();
</script></body></html>
